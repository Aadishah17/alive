name: ALIVE
options:
  bundleIdPrefix: com.alive
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  ALIVE:
    type: application
    platform: iOS
    sources:
      - path: ALIVE
        excludes:
          - Extension
          - Tests
          - WatchApp
      - path: ALIVE/Extension/LiveActivity/FocusLiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alive.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ALIVE
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Use Face ID to unlock your ALIVE profile."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "ALIVE reads today’s step count to track your walking quest."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    entitlements:
      path: ALIVE/ALIVE.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - target: ALIVEWidgets
        embed: true

  ALIVEWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ALIVE/Extension/Widgets
      - path: ALIVE/Extension/LiveActivity
      - path: ALIVE/Theme/ColorPalette.swift
    info:
      path: ALIVE/Extension/Widgets/Info.plist
      properties:
        CFBundleDisplayName: ALIVE Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alive.app.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  ALIVETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ALIVE/Tests
    dependencies:
      - target: ALIVE
